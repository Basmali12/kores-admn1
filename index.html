<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المدير</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="login-container" class="login-container">
        <div class="login-box">
            <input type="password" id="login-password" placeholder="" autofocus />
            <button id="login-submit">دخول</button>
        </div>
    </div>

    <div id="app-container" class="app-container hidden">
        <div id="course-section" class="section-container">
            <header class="app-header">
                <h2>الكورس</h2>
                <button id="add-video-btn" class="primary-btn">إضافة فيديو</button>
            </header>

            <main class="content-scroll">
                <div id="videos-grid" class="videos-grid">
                    </div>
            </main>
        </div>

        <div id="users-section" class="section-container hidden">
            <header class="app-header">
                <h2>تفعيل المشترك</h2>
                <button id="add-user-btn" class="primary-btn">إضافة مشترك جديد</button>
            </header>

            <main class="content-scroll">
                <div id="users-list" class="users-list">
                    </div>
            </main>
        </div>

        <nav class="bottom-nav">
            <button id="nav-course" class="nav-item active">الكورس</button>
            <button id="nav-users" class="nav-item">تفعيل المشترك</button>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modal-title">إضافة فيديو</h3>
            <div class="form-group">
                <label>اسم الفيديو</label>
                <input type="text" id="video-name" placeholder="ادخل اسم الفيديو...">
            </div>
            
            <div class="form-group">
                <label>حالة الفيديو (الوصول)</label>
                <select id="video-type" style="padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    <option value="free">مجاني (متاح للجميع)</option>
                    <option value="paid">مدفوع (للمشتركين المفعلين فقط)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>صورة مصغرة</label>
                <input type="file" id="image-upload" accept="image/*">
                <div class="preview-container">
                    <img id="image-preview" class="media-preview hidden" alt="معاينة الصورة" />
                </div>
            </div>

            <div class="form-group">
                <label>ملف الفيديو</label>
                <input type="file" id="video-upload" accept="video/*">
                <div class="preview-container">
                    <video id="video-preview" class="media-preview hidden" controls></video>
                    <iframe id="iframe-preview" class="media-preview hidden" src="" style="border:none;" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
                </div>
            </div>

            <div class="modal-actions">
                <button id="save-btn" class="primary-btn">حفظ</button>
                <button id="bg-ok-btn" class="primary-btn hidden" style="background:#2e7d32;">موافق</button>
                <button id="cancel-btn" class="secondary-btn">إلغاء</button>
            </div>
            <div id="upload-status" class="status-msg"></div>
            <div id="upload-progress-container" class="hidden" style="width: 100%; background: #e0e0e0; border-radius: 8px; margin-top: 10px; overflow: hidden; height: 10px;">
                <div id="upload-progress-bar" style="width: 0%; height: 100%; background: #4285F4; transition: width 0.2s;"></div>
            </div>
        </div>
    </div>

    <div id="add-user-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>إضافة مشترك جديد</h3>
            <div class="form-group">
                <label>ايدي المستخدم (الايميل / المعرف)</label>
                <input type="text" id="new-user-id" placeholder="ادخل ايدي المستخدم...">
            </div>
            <div class="form-group">
                <label>تاريخ التفعيل</label>
                <input type="text" id="new-user-date" readonly disabled style="background:#eee; color:#666;">
            </div>
            <div class="modal-actions">
                <button id="save-user-btn" class="primary-btn">تفعيل برو</button>
                <button id="cancel-user-btn" class="secondary-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="user-details-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>تفاصيل المشترك</h3>
            <div class="form-group">
                <label>ايدي المستخدم</label>
                <input type="text" id="edit-user-id" placeholder="تعديل الايدي...">
            </div>
            <div class="form-group">
                <label>تاريخ الإنشاء</label>
                <p id="detail-user-date" style="margin: 5px 0; color: #555;"></p>
            </div>
            <div class="form-group">
                <label>حالة الحساب</label>
                <p id="detail-user-status" style="margin: 5px 0; font-weight: bold;"></p>
            </div>
            <div class="modal-actions" style="flex-wrap: wrap;">
                <button id="update-user-btn" class="primary-btn">حفظ التعديل</button>
                <button id="freeze-user-btn" class="secondary-btn" style="background: #ff9800;">تجميد</button>
                <button id="delete-user-btn" class="secondary-btn">حذف</button>
                <button id="close-user-details-btn" class="secondary-btn" style="background:#6c757d;">إغلاق</button>
            </div>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
